[package]
name = "proxy-bridge-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ProxyBridge Linux implementation: NFQUEUE + nftables + process-level transparent proxy"
build = "build.rs"

[[bin]]
name = "proxy-bridge"
path = "src/main.rs"

[dependencies]
proxy-bridge-core = { path = "../crates/proxy-bridge-core" }
proxy-bridge-cli = { path = "../crates/proxy-bridge-cli" }
nfq = "0.2"
nftnl = "0.9"
mnl = { version = "0.3", default-features = false }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
nix = { version = "0.29", features = ["fs", "process", "signal", "net", "user"] }
libc = "0.2"
anyhow = "1"
ctrlc = "3"

[build-dependencies]
pkg-config = "0.3"
