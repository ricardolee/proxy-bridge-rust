name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            deb_arch: amd64
            pkg_config_path: /usr/lib/x86_64-linux-gnu/pkgconfig
            pkg_config_system_library_path: ""
            linker: ""
            cc: ""
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            deb_arch: arm64
            pkg_config_path: /usr/lib/aarch64-linux-gnu/pkgconfig
            pkg_config_system_library_path: /usr/lib/aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
            cc: aarch64-linux-gnu-gcc
            cross_pkg: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
          - target: armv7-unknown-linux-gnueabihf
            arch: armv7
            deb_arch: armhf
            pkg_config_path: /usr/lib/arm-linux-gnueabihf/pkgconfig
            pkg_config_system_library_path: /usr/lib/arm-linux-gnueabihf
            linker: arm-linux-gnueabihf-gcc
            cc: arm-linux-gnueabihf-gcc
            cross_pkg: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            linker_env: CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and Inject Version
        run: |
          # Extract version from tag (e.g., refs/tags/v1.2.3 -> 1.2.3 or refs/tags/1.2.3 -> 1.2.3)
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "Building Version: $VERSION"
          
          # Replace version in Cargo.toml [workspace.package] using sed
          sed -i '/\[workspace\.package\]/,/^[[:space:]]*$/ s/^version = "[^"]*"/version = "'"$VERSION"'"/' Cargo.toml
          
          # Display the modified Cargo.toml to verify
          head -n 20 Cargo.toml

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config

      - name: Install Cross-compilation Dependencies
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          # Enable target architecture
          sudo dpkg --add-architecture ${{ matrix.deb_arch }}
          
          # Restrict standard repository lists to amd64
          sudo find /etc/apt/sources.list /etc/apt/sources.list.d/ -type f -name "*.list" -exec sed -i 's/^deb http/deb [arch=amd64] http/g' {} +
          sudo find /etc/apt/sources.list /etc/apt/sources.list.d/ -type f -name "*.list" -exec sed -i 's/^deb mirror/deb [arch=amd64] mirror/g' {} +
          
          # Add ports.ubuntu.com for target architecture
          CODENAME=$(lsb_release -cs)
          sudo tee /etc/apt/sources.list.d/ports.list <<EOF
          deb [arch=${{ matrix.deb_arch }}] http://ports.ubuntu.com/ubuntu-ports ${CODENAME} main restricted universe multiverse
          deb [arch=${{ matrix.deb_arch }}] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-updates main restricted universe multiverse
          deb [arch=${{ matrix.deb_arch }}] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-security main restricted universe multiverse
          EOF
          
          # Update repositories
          sudo apt-get update
          
          # Install cross compilers and target libraries
          sudo apt-get install -y ${{ matrix.cross_pkg }}
          sudo apt-get install -y libnetfilter-queue-dev:${{ matrix.deb_arch }} libnftnl-dev:${{ matrix.deb_arch }} libmnl-dev:${{ matrix.deb_arch }}
          
          # Clean target .pc files to omit -L paths so they don't leak into host build scripts
          sudo sed -i 's/-L\${libdir}//g' ${{ matrix.pkg_config_path }}/*.pc || true
          sudo sed -i 's/-L${{ matrix.pkg_config_system_library_path }}//g' ${{ matrix.pkg_config_path }}/*.pc || true

      - name: Install Host Build Libraries
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y libnetfilter-queue-dev libnftnl-dev libmnl-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_PATH: ${{ matrix.pkg_config_path }}
          PKG_CONFIG_SYSTEM_LIBRARY_PATH: ${{ matrix.pkg_config_system_library_path }}
          PKG_CONFIG_SYSTEM_INCLUDE_PATH: /usr/include
        run: |
          if [ -n "${{ matrix.linker_env }}" ]; then
            export ${{ matrix.linker_env }}="${{ matrix.linker }}"
          fi
          if [ -n "${{ matrix.cc }}" ]; then
            export CC="${{ matrix.cc }}"
          fi
          cargo build --release --target ${{ matrix.target }} -p proxy-bridge-linux --target-dir target

      - name: Package Binary
        run: |
          BINARY_DIR="target/${{ matrix.target }}/release"
          # Package the binary
          tar -czvf "proxy-bridge-linux-${{ matrix.arch }}.tar.gz" -C "$BINARY_DIR" proxy-bridge
          ls -lh "proxy-bridge-linux-${{ matrix.arch }}.tar.gz"

      - name: Create or Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: proxy-bridge-linux-${{ matrix.arch }}.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
